<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Snake Game - Themed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-color: #ffffff;
            --board-bg: #1e293b;
            --snake-color: #22c55e;
            --food-color: #ef4444;
            --font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- CYBERPUNK THEME --- */
        [data-theme="cyberpunk"] {
            --bg-color: #050505;
            --board-bg: rgba(0, 20, 20, 0.8);
            --snake-color: #0ff;
            --food-color: #f0f;
            --font-family: 'Courier New', monospace;
        }
        [data-theme="cyberpunk"] body {
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        [data-theme="cyberpunk"] .game-container {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid #0ff;
        }

        /* --- GLASSMORPHISM THEME --- */
        [data-theme="glass"] {
            --bg-color: #e2e8f0;
            --board-bg: rgba(255, 255, 255, 0.1);
            --text-color: #1e293b;
            --snake-color: #3b82f6;
            --food-color: #ec4899;
        }
        [data-theme="glass"] .game-container, 
        [data-theme="glass"] .scoreboard,
        [data-theme="glass"] .game-over-modal {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        [data-theme="glass"] .text-white {
            color: #1e293b;
        }

        /* --- RETRO CRT THEME --- */
        [data-theme="retro"] {
            --bg-color: #000000;
            --board-bg: #000000;
            --snake-color: #39ff14;
            --food-color: #ff003c;
            --font-family: 'Press Start 2P', cursive;
        }
        [data-theme="retro"] #crt-overlay {
            display: block;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }
        [data-theme="retro"] .game-container {
            border: 4px solid #39ff14;
            border-radius: 0;
        }

        /* Utilities */
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        canvas {
            background-color: var(--board-bg);
            border-radius: 0.5rem;
            display: block;
        }
        [data-theme="retro"] canvas { border-radius: 0; }
    </style>
</head>
<body class="antialiased">
    <!-- Theme Selector UI -->
    <div class="absolute top-4 right-4 z-50">
        <select id="theme-selector" class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-1 outline-none cursor-pointer text-sm font-sans">
            <option value="default">Dark Minimalist</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="glass">Advanced Glassmorphism</option>
            <option value="retro">Retro CRT Arcade</option>
        </select>
    </div>

    <!-- Overlays -->
    <div id="crt-overlay" class="pointer-events-none fixed inset-0 z-40 hidden"></div>
    <div id="glass-blobs" class="pointer-events-none fixed inset-0 z-0 hidden overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-1/4 right-1/3 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <div class="relative z-10 flex flex-col items-center">
        <!-- Scoreboard -->
        <div class="scoreboard flex justify-between w-full max-w-md px-6 py-4 mb-4 bg-slate-800 rounded-xl shadow-lg border border-slate-700">
            <div class="text-center">
                <p class="text-xs text-slate-400 font-bold tracking-wider uppercase mb-1">Score</p>
                <p id="scoreEl" class="text-3xl font-bold text-white leading-none">0</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-slate-400 font-bold tracking-wider uppercase mb-1">Best</p>
                <p id="bestScoreEl" class="text-3xl font-bold text-yellow-500 leading-none">0</p>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-container relative p-2 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- Game Over Modal -->
            <div id="gameOverModal" class="game-over-modal absolute inset-0 bg-slate-900/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
                <h2 class="text-4xl font-black text-red-500 mb-2 tracking-tight">GAME OVER</h2>
                <p class="text-slate-300 mb-6 font-medium">You scored <span id="finalScore" class="text-white font-bold">0</span> points.</p>
                <button id="restartBtn" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(16,185,129,0.4)] cursor-pointer">
                    Play Again
                </button>
            </div>

            <!-- Start Overlay -->
            <div id="startModal" class="game-over-modal absolute inset-0 bg-slate-900/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center">
                <button id="startBtn" class="px-8 py-3 bg-blue-500 hover:bg-blue-400 text-white font-bold rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(59,130,246,0.4)] cursor-pointer">
                    Start Game
                </button>
                <p class="text-slate-400 mt-4 text-sm font-sans">Use Arrow Keys</p>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mt-8 grid grid-cols-3 gap-2 w-48 md:hidden z-10 relative">
        <div class="col-start-2"><button id="upBtn" class="w-full h-12 bg-slate-800 rounded-lg active:bg-slate-700 text-white font-bold shadow cursor-pointer">↑</button></div>
        <div class="col-start-1"><button id="leftBtn" class="w-full h-12 bg-slate-800 rounded-lg active:bg-slate-700 text-white font-bold shadow cursor-pointer">←</button></div>
        <div class="col-start-2"><button id="downBtn" class="w-full h-12 bg-slate-800 rounded-lg active:bg-slate-700 text-white font-bold shadow cursor-pointer">↓</button></div>
        <div class="col-start-3"><button id="rightBtn" class="w-full h-12 bg-slate-800 rounded-lg active:bg-slate-700 text-white font-bold shadow cursor-pointer">→</button></div>
    </div>

    <script>
        // --- THEME MANAGEMENT ---
        const themeSelector = document.getElementById('theme-selector');
        const crtOverlay = document.getElementById('crt-overlay');
        const glassBlobs = document.getElementById('glass-blobs');
        
        const savedTheme = localStorage.getItem('snake-theme') || 'default';
        applyTheme(savedTheme);
        themeSelector.value = savedTheme;

        themeSelector.addEventListener('change', (e) => {
            const selectedTheme = e.target.value;
            applyTheme(selectedTheme);
            localStorage.setItem('snake-theme', selectedTheme);
        });

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'glass') glassBlobs.classList.remove('hidden');
            else glassBlobs.classList.add('hidden');
            
            if (theme === 'retro') crtOverlay.classList.remove('hidden');
            else crtOverlay.classList.add('hidden');
        }

        // --- GAME LOGIC ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreEl");
        const bestScoreEl = document.getElementById("bestScoreEl");
        const finalScoreEl = document.getElementById("finalScore");
        const gameOverModal = document.getElementById("gameOverModal");
        const restartBtn = document.getElementById("restartBtn");
        const startModal = document.getElementById("startModal");
        const startBtn = document.getElementById("startBtn");

        let gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let velocityX = 0, velocityY = 0;
        let snake = [];
        let snakeLength = 4;
        let foodX = 10, foodY = 10;
        let score = 0;
        let bestScore = localStorage.getItem("snakeBestScore") || 0;
        bestScoreEl.innerText = bestScore;
        
        let gameLoopTimeout;
        let isPlaying = false;

        function resetGame() {
            snake = [{x: 10, y: 10}];
            snakeLength = 4;
            velocityX = 0;
            velocityY = 0;
            score = 0;
            scoreEl.innerText = score;
            placeFood();
            gameOverModal.classList.add('hidden');
            gameOverModal.classList.remove('opacity-100');
            gameOverModal.classList.add('opacity-0');
            isPlaying = true;
            gameLoop();
        }

        function placeFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            for (let segment of snake) {
                if (segment.x === foodX && segment.y === foodY) placeFood();
            }
        }

        function gameLoop() {
            if(!isPlaying) return;

            let headX = snake[0].x + velocityX;
            let headY = snake[0].y + velocityY;

            if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
                return gameOver();
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === headX && snake[i].y === headY && i !== 0) {
                    return gameOver();
                }
            }

            snake.unshift({x: headX, y: headY});

            if (headX === foodX && headY === foodY) {
                score += 10;
                scoreEl.innerText = score;
                snakeLength++;
                placeFood();
                if (score > bestScore) {
                    bestScore = score;
                    bestScoreEl.innerText = bestScore;
                    localStorage.setItem("snakeBestScore", bestScore);
                }
            }

            while (snake.length > snakeLength) {
                snake.pop();
            }

            draw();
            
            let speed = Math.max(50, 100 - (score / 10));
            gameLoopTimeout = setTimeout(gameLoop, speed);
        }

        function draw() {
            const rootStyles = getComputedStyle(document.documentElement);
            const snakeColor = rootStyles.getPropertyValue('--snake-color').trim() || '#22c55e';
            const foodColor = rootStyles.getPropertyValue('--food-color').trim() || '#ef4444';

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = foodColor;
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 1, gridSize - 1);

            ctx.fillStyle = snakeColor;
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }
        }

        function gameOver() {
            isPlaying = false;
            finalScoreEl.innerText = score;
            gameOverModal.classList.remove('hidden');
            void gameOverModal.offsetWidth;
            gameOverModal.classList.remove('opacity-0');
            gameOverModal.classList.add('opacity-100');
        }

        function changeDirection(e) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            if (!isPlaying) return;

            if (e.key === "ArrowUp" && velocityY !== 1) { velocityX = 0; velocityY = -1; }
            if (e.key === "ArrowDown" && velocityY !== -1) { velocityX = 0; velocityY = 1; }
            if (e.key === "ArrowLeft" && velocityX !== 1) { velocityX = -1; velocityY = 0; }
            if (e.key === "ArrowRight" && velocityX !== -1) { velocityX = 1; velocityY = 0; }
        }

        document.addEventListener("keydown", changeDirection);
        
        startBtn.addEventListener("click", () => {
            startModal.classList.add('hidden');
            velocityX = 1; velocityY = 0;
            resetGame();
        });
        restartBtn.addEventListener("click", () => {
            velocityX = 1; velocityY = 0;
            resetGame();
        });

        document.getElementById('upBtn').onclick = () => { if(velocityY !== 1) { velocityX = 0; velocityY = -1; } };
        document.getElementById('downBtn').onclick = () => { if(velocityY !== -1) { velocityX = 0; velocityY = 1; } };
        document.getElementById('leftBtn').onclick = () => { if(velocityX !== 1) { velocityX = -1; velocityY = 0; } };
        document.getElementById('rightBtn').onclick = () => { if(velocityX !== -1) { velocityX = 1; velocityY = 0; } };

        draw();
    </script>
</body>
</html>
