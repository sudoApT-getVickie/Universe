<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+New&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --board-bg: rgba(0, 20, 20, 0.8);
            --snake-color: #0ff;
            --food-color: #f0f;
            --font-family: 'Courier New', monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid #0ff;
        }

        canvas {
            background-color: var(--board-bg);
            border-radius: 0.5rem;
            display: block;
        }
    </style>
</head>
<body class="antialiased">
    <div class="relative z-10 flex flex-col items-center">
        <!-- Scoreboard -->
        <div class="scoreboard flex justify-between w-full max-w-md px-6 py-4 mb-4 bg-slate-900 rounded-xl shadow-[0_0_15px_rgba(0,255,255,0.2)] border border-cyan-900">
            <div class="text-center">
                <p class="text-xs text-cyan-400 font-bold tracking-wider uppercase mb-1">Score</p>
                <p id="scoreEl" class="text-3xl font-bold text-white leading-none">0</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-cyan-400 font-bold tracking-wider uppercase mb-1">Best</p>
                <p id="bestScoreEl" class="text-3xl font-bold text-fuchsia-500 leading-none">0</p>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-container relative p-2 bg-black rounded-2xl">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- Game Over Modal -->
            <div id="gameOverModal" class="absolute inset-0 bg-black/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
                <h2 class="text-4xl font-black text-fuchsia-500 mb-2 tracking-tight drop-shadow-[0_0_10px_rgba(255,0,255,0.8)]">SYSTEM FAILURE</h2>
                <p class="text-cyan-300 mb-6 font-medium">Data collected: <span id="finalScore" class="text-white font-bold">0</span> bytes.</p>
                <button id="restartBtn" class="px-8 py-3 bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-black font-bold rounded transition-all shadow-[0_0_15px_rgba(0,255,255,0.4)] cursor-pointer uppercase">
                    Reboot
                </button>
            </div>

            <!-- Start Overlay -->
            <div id="startModal" class="absolute inset-0 bg-black/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center">
                <button id="startBtn" class="px-8 py-3 bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-black font-bold rounded transition-all shadow-[0_0_15px_rgba(0,255,255,0.4)] cursor-pointer uppercase">
                    Initialize
                </button>
                <p class="text-cyan-600 mt-4 text-sm font-sans">Use Arrow Keys</p>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mt-8 grid grid-cols-3 gap-2 w-48 md:hidden z-10 relative">
        <div class="col-start-2"><button id="upBtn" class="w-full h-12 bg-slate-900 border border-cyan-800 rounded-lg active:bg-cyan-900 text-cyan-400 font-bold shadow-[0_0_10px_rgba(0,255,255,0.2)] cursor-pointer">↑</button></div>
        <div class="col-start-1"><button id="leftBtn" class="w-full h-12 bg-slate-900 border border-cyan-800 rounded-lg active:bg-cyan-900 text-cyan-400 font-bold shadow-[0_0_10px_rgba(0,255,255,0.2)] cursor-pointer">←</button></div>
        <div class="col-start-2"><button id="downBtn" class="w-full h-12 bg-slate-900 border border-cyan-800 rounded-lg active:bg-cyan-900 text-cyan-400 font-bold shadow-[0_0_10px_rgba(0,255,255,0.2)] cursor-pointer">↓</button></div>
        <div class="col-start-3"><button id="rightBtn" class="w-full h-12 bg-slate-900 border border-cyan-800 rounded-lg active:bg-cyan-900 text-cyan-400 font-bold shadow-[0_0_10px_rgba(0,255,255,0.2)] cursor-pointer">→</button></div>
    </div>

    <script>
        // --- GAME LOGIC ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreEl");
        const bestScoreEl = document.getElementById("bestScoreEl");
        const finalScoreEl = document.getElementById("finalScore");
        const gameOverModal = document.getElementById("gameOverModal");
        const restartBtn = document.getElementById("restartBtn");
        const startModal = document.getElementById("startModal");
        const startBtn = document.getElementById("startBtn");

        let gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let velocityX = 0, velocityY = 0;
        let snake = [];
        let snakeLength = 4;
        let foodX = 10, foodY = 10;
        let score = 0;
        let bestScore = localStorage.getItem("snakeBestScore") || 0;
        bestScoreEl.innerText = bestScore;
        
        let gameLoopTimeout;
        let isPlaying = false;

        // Fetch CSS variables for canvas drawing
        const rootStyles = getComputedStyle(document.documentElement);
        const snakeColor = rootStyles.getPropertyValue('--snake-color').trim() || '#0ff';
        const foodColor = rootStyles.getPropertyValue('--food-color').trim() || '#f0f';

        function resetGame() {
            snake = [{x: 10, y: 10}];
            snakeLength = 4;
            velocityX = 0;
            velocityY = 0;
            score = 0;
            scoreEl.innerText = score;
            placeFood();
            gameOverModal.classList.add('hidden');
            gameOverModal.classList.remove('opacity-100');
            gameOverModal.classList.add('opacity-0');
            isPlaying = true;
            gameLoop();
        }

        function placeFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            for (let segment of snake) {
                if (segment.x === foodX && segment.y === foodY) placeFood();
            }
        }

        function gameLoop() {
            if(!isPlaying) return;

            let headX = snake[0].x + velocityX;
            let headY = snake[0].y + velocityY;

            if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
                return gameOver();
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === headX && snake[i].y === headY && i !== 0) {
                    return gameOver();
                }
            }

            snake.unshift({x: headX, y: headY});

            if (headX === foodX && headY === foodY) {
                score += 10;
                scoreEl.innerText = score;
                snakeLength++;
                placeFood();
                if (score > bestScore) {
                    bestScore = score;
                    bestScoreEl.innerText = bestScore;
                    localStorage.setItem("snakeBestScore", bestScore);
                }
            }

            while (snake.length > snakeLength) {
                snake.pop();
            }

            draw();
            
            let speed = Math.max(50, 100 - (score / 10));
            gameLoopTimeout = setTimeout(gameLoop, speed);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Food with neon glow
            ctx.fillStyle = foodColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = foodColor;
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 1, gridSize - 1);

            // Draw Snake with neon glow
            ctx.fillStyle = snakeColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = snakeColor;
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }
            
            // Reset shadow to prevent bleeding into other operations
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isPlaying = false;
            finalScoreEl.innerText = score;
            gameOverModal.classList.remove('hidden');
            void gameOverModal.offsetWidth;
            gameOverModal.classList.remove('opacity-0');
            gameOverModal.classList.add('opacity-100');
        }

        function changeDirection(e) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            if (!isPlaying) return;

            if (e.key === "ArrowUp" && velocityY !== 1) { velocityX = 0; velocityY = -1; }
            if (e.key === "ArrowDown" && velocityY !== -1) { velocityX = 0; velocityY = 1; }
            if (e.key === "ArrowLeft" && velocityX !== 1) { velocityX = -1; velocityY = 0; }
            if (e.key === "ArrowRight" && velocityX !== -1) { velocityX = 1; velocityY = 0; }
        }

        document.addEventListener("keydown", changeDirection);
        
        startBtn.addEventListener("click", () => {
            startModal.classList.add('hidden');
            velocityX = 1; velocityY = 0;
            resetGame();
        });
        restartBtn.addEventListener("click", () => {
            velocityX = 1; velocityY = 0;
            resetGame();
        });

        document.getElementById('upBtn').onclick = () => { if(velocityY !== 1) { velocityX = 0; velocityY = -1; } };
        document.getElementById('downBtn').onclick = () => { if(velocityY !== -1) { velocityX = 0; velocityY = 1; } };
        document.getElementById('leftBtn').onclick = () => { if(velocityX !== 1) { velocityX = -1; velocityY = 0; } };
        document.getElementById('rightBtn').onclick = () => { if(velocityX !== -1) { velocityX = 1; velocityY = 0; } };

        draw(); // Initial empty draw
    </script>
</body>
</html>
