<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Snake Game</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Styles to supplement Tailwind */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
            touch-action: none; /* Prevent zooming/panning on the game board */
        }
        
        #game-board {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            background-color: #1e293b; /* Slate 800 */
        }

        /* D-Pad Buttons styling */
        .d-pad-btn {
            background: linear-gradient(145deg, #334155, #1e293b);
            box-shadow: 4px 4px 8px #151d2a, -4px -4px 8px #27354c;
            transition: all 0.1s ease;
        }
        
        .d-pad-btn:active {
            background: #1e293b;
            box-shadow: inset 4px 4px 8px #151d2a, inset -4px -4px 8px #27354c;
        }

        /* Pulsing effect for the food */
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 select-none">

    <!-- Header / Scoreboard -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <div class="flex flex-col">
            <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Score</span>
            <span id="score" class="text-3xl font-black text-emerald-400">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Best</span>
            <span id="high-score" class="text-3xl font-black text-amber-400">0</span>
        </div>
    </div>

    <!-- Game Area Container -->
    <div class="relative w-full max-w-md aspect-square rounded-xl overflow-hidden border-4 border-slate-700">
        <!-- Canvas -->
        <canvas id="game-board" width="400" height="400" class="w-full h-full block"></canvas>

        <!-- Overlays (Start & Game Over) -->
        <div id="overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300 z-10">
            <h1 id="overlay-title" class="text-4xl font-black text-white mb-2 tracking-tight text-center drop-shadow-md">SNAKE</h1>
            <p id="overlay-subtitle" class="text-slate-300 mb-8 text-center px-4">Use arrow keys or buttons to move.<br>Don't hit the walls or yourself!</p>
            <button id="start-btn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all transform hover:scale-105 active:scale-95 text-lg">
                Play Game
            </button>
        </div>
    </div>

    <!-- Mobile Controls (D-Pad) -->
    <div class="mt-8 grid grid-cols-3 gap-2 w-48 sm:hidden">
        <div></div>
        <button id="btn-up" class="d-pad-btn rounded-lg h-14 flex items-center justify-center text-slate-300" aria-label="Up">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
        </button>
        <div></div>
        <button id="btn-left" class="d-pad-btn rounded-lg h-14 flex items-center justify-center text-slate-300" aria-label="Left">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="btn-down" class="d-pad-btn rounded-lg h-14 flex items-center justify-center text-slate-300" aria-label="Down">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <button id="btn-right" class="d-pad-btn rounded-lg h-14 flex items-center justify-center text-slate-300" aria-label="Right">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

    <!-- Scripts -->
    <script>
        // DOM Elements
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const startBtn = document.getElementById('start-btn');

        // Game Constants & Configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize; // 20x20 grid
        const initialSpeed = 150; // ms per frame
        const minSpeed = 50; // Fastest speed allowed
        const speedDecrement = 2; // How much to reduce timeout per food eaten

        // Game State Variables
        let snake = [];
        let dx = 0; // Velocity X
        let dy = 0; // Velocity Y
        let foodX;
        let foodY;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoopTimeout;
        let isPlaying = false;
        let changingDirection = false; // Prevent rapid double key presses
        let currentSpeed = initialSpeed;

        // Initialize High Score Display
        highScoreElement.textContent = highScore;

        // Start / Restart Game
        function initGame() {
            // Reset Snake to middle
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            
            // Initial Movement (Up)
            dx = 0;
            dy = -1;
            
            // Reset Score & Speed
            score = 0;
            currentSpeed = initialSpeed;
            scoreElement.textContent = score;
            
            // Spawn initial food
            spawnFood();
            
            // Update UI
            overlay.classList.add('hidden');
            isPlaying = true;
            
            // Start Loop
            clearTimeout(gameLoopTimeout);
            gameLoop();
        }

        // Main Game Loop
        function gameLoop() {
            if (!isPlaying) return;
            
            changingDirection = false;
            
            gameLoopTimeout = setTimeout(() => {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                
                if (checkCollision()) {
                    gameOver();
                } else {
                    gameLoop();
                }
            }, currentSpeed);
        }

        // Clear the canvas each frame
        function clearCanvas() {
            ctx.fillStyle = '#1e293b'; // Matches Tailwind slate-800
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Optional: Draw subtle grid lines
            ctx.strokeStyle = '#334155'; // Tailwind slate-700
            ctx.lineWidth = 0.5;
            for(let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        // Move the snake coordinates
        function advanceSnake() {
            // Calculate new head position
            const head = { 
                x: snake[0].x + dx, 
                y: snake[0].y + dy 
            };
            
            // Add new head to beginning of array
            snake.unshift(head);
            
            // Check if food was eaten
            if (head.x === foodX && head.y === foodY) {
                // Score up
                score += 10;
                scoreElement.textContent = score;
                
                // Increase speed (decrease timeout)
                if (currentSpeed > minSpeed) {
                    currentSpeed -= speedDecrement;
                }
                
                spawnFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }

        // Render the snake on canvas
        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter, body is slightly darker
                ctx.fillStyle = index === 0 ? '#34d399' : '#10b981'; // emerald-400 / emerald-500
                
                // Inner padding for visual gap between segments
                ctx.fillRect(
                    part.x * gridSize + 1, 
                    part.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2
                );
                
                // Draw eyes on the head
                if (index === 0) {
                    ctx.fillStyle = '#0f172a'; // dark eye color
                    const eyeSize = 3;
                    const offset = 4;
                    
                    if (dx === 1) { // Moving Right
                        ctx.fillRect(part.x * gridSize + gridSize - offset - eyeSize, part.y * gridSize + offset, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - offset - eyeSize, part.y * gridSize + gridSize - offset - eyeSize, eyeSize, eyeSize);
                    } else if (dx === -1) { // Moving Left
                        ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + offset, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + gridSize - offset - eyeSize, eyeSize, eyeSize);
                    } else if (dy === -1) { // Moving Up
                        ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + offset, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - offset - eyeSize, part.y * gridSize + offset, eyeSize, eyeSize);
                    } else if (dy === 1) { // Moving Down
                        ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + gridSize - offset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - offset - eyeSize, part.y * gridSize + gridSize - offset - eyeSize, eyeSize, eyeSize);
                    }
                }
            });
        }

        // Render food
        function drawFood() {
            ctx.fillStyle = '#ef4444'; // red-500
            
            // Draw a rounded rectangle or circle for food
            ctx.beginPath();
            ctx.arc(
                foodX * gridSize + gridSize / 2, 
                foodY * gridSize + gridSize / 2, 
                gridSize / 2 - 2, 
                0, 
                2 * Math.PI
            );
            ctx.fill();
        }

        // Generate random food coordinates
        function spawnFood() {
            // Helper to generate random number within grid
            function randomTen(min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min);
            }
            
            foodX = randomTen(0, tileCount - 1);
            foodY = randomTen(0, tileCount - 1);
            
            // Ensure food doesn't spawn ON the snake
            snake.forEach(function isFoodOnSnake(part) {
                const foodIsOnSnake = part.x === foodX && part.y === foodY;
                if (foodIsOnSnake) spawnFood();
            });
        }

        // Collision logic
        function checkCollision() {
            const head = snake[0];
            
            // 1. Wall Collision
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;
            
            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) {
                return true;
            }
            
            // 2. Self Collision
            for (let i = 4; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        // Game Over Sequence
        function gameOver() {
            isPlaying = false;
            
            // Handle High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            
            // Show Overlay
            overlayTitle.textContent = "GAME OVER";
            overlayTitle.classList.replace('text-white', 'text-red-500');
            overlaySubtitle.innerHTML = `You scored <span class="font-bold text-white">${score}</span> points.`;
            startBtn.textContent = "Play Again";
            
            overlay.classList.remove('hidden');
            overlay.style.opacity = 1;
        }

        // Input Handling
        function changeDirection(newDx, newDy) {
            if (changingDirection || !isPlaying) return;
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;
            
            // Prevent 180-degree turns
            if (newDx === 1 && goingLeft) return;
            if (newDx === -1 && goingRight) return;
            if (newDy === 1 && goingUp) return;
            if (newDy === -1 && goingDown) return;
            
            dx = newDx;
            dy = newDy;
            changingDirection = true;
        }

        // Keyboard Listeners
        window.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys and space
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (!isPlaying && e.code === "Space") {
                initGame();
                return;
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(1, 0);
                    break;
            }
        });

        // Mobile D-Pad Listeners
        document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(0, -1); });
        document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(0, 1); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(-1, 0); });
        document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(1, 0); });

        // Start Button Listener
        startBtn.addEventListener('click', initGame);

        // Initial setup (draw background)
        clearCanvas();

    </script>
</body>
</html>
